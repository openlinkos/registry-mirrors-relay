# separate management port: NodePort does not need externalTrafficPolicy: Local either; the ServiceMonitor
# scrapes the admin port and NetworkPolicy lets metricsFrom in
admin:
  separatePort: true
service:
  type: NodePort
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
networkPolicy:
  enabled: true
config:
  metrics: {pprof: true}
