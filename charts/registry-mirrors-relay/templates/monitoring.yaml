{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rmr.fullname" . }}
  labels:
    {{- include "rmr.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rmr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ ternary "admin" "relay" .Values.admin.separatePort }}
  endpoints:
    - port: {{ include "rmr.mgmtPort" . }}
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.metrics.dashboard.enabled }}
---
# Grafana dashboard: the Grafana sidecar of kube-prometheus-stack imports it automatically by label
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rmr.fullname" . }}-dashboard
  labels:
    {{- include "rmr.labels" . | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  registry-mirrors-relay.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
