{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rmr.fullname" . }}
  labels:
    {{- include "rmr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rmr.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # pull entrance: containerd on the nodes, Pods in the cluster, the Ingress or Gateway all connect to it
    - ports:
        - port: {{ .Values.containerPorts.http }}
          protocol: TCP
    {{- if .Values.admin.separatePort }}
    {{- with .Values.networkPolicy.metricsFrom }}
    # separate management port: only for metricsFrom (for example Prometheus). kubectl port-forward does not go
    # through NetworkPolicy
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.containerPorts.admin }}
          protocol: TCP
    {{- end }}
    {{- end }}
    # on a shared port the relay guards the management paths itself (sign-in for the console, direct
    # connections only for metrics): NetworkPolicy cannot filter by path
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.dnsTo | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # upstream registries, token services and object storage: HTTPS only, internet only (the relay itself also
    # refuses to connect to internal addresses)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.egressExceptIPv4 | nindent 14 }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- toYaml .Values.networkPolicy.egressExceptIPv6 | nindent 14 }}
      ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
