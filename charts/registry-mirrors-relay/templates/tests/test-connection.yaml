{{- if .Values.tests.enabled }}
# helm test: probes the Service's /readyz with the relay image's own probe command, so no other image is pulled.
# It does not carry the selector labels, so that NetworkPolicy does not treat it as a relay Pod and restrict its egress.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rmr.fullname" . }}-test
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: probe
      image: {{ include "rmr.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # a new Service is reachable only after kube-proxy has synced, so retry for up to 60 seconds
      args: [probe, -url, "http://{{ include "rmr.fullname" . }}:{{ .Values.service.port }}/readyz", -timeout, 5s, -wait, 60s]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        limits:
          memory: 64Mi
{{- end }}
