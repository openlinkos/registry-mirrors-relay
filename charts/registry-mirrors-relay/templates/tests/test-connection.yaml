{{- if .Values.tests.enabled }}
# helm test：用 relay 镜像自己的 probe 命令探测 Service 的 /readyz，不用另拉镜像。
# 不带 selector 用的标签，免得被 NetworkPolicy 当成 relay 的 Pod 限制出站。
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rmr.fullname" . }}-test
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: probe
      image: {{ include "rmr.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: [probe, -url, "http://{{ include "rmr.fullname" . }}:{{ .Values.service.port }}/readyz", -timeout, 10s]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        limits:
          memory: 64Mi
{{- end }}
