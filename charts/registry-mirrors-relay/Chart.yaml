apiVersion: v2
name: registry-mirrors-relay
description: A container registry mirror that relays and never stores image data, with a built-in admin console.
type: application
# release.yml changes this to the tag's version when releasing (the chart and the application share one version number)
version: 0.6.2
appVersion: "v0.6.2"
# the preStop sleep action needs 1.30+
kubeVersion: ">=1.30.0-0"
home: https://github.com/openlinkos/registry-mirrors-relay
sources:
  - https://github.com/openlinkos/registry-mirrors-relay
keywords:
  - registry
  - mirror
  - docker
  - containerd
  - oci
  - proxy
maintainers:
  - name: OpenLinkOS
    url: https://github.com/openlinkos
annotations:
  # the digest of the appVersion image is written here when releasing; the image is pulled by it when neither
  # image.tag nor image.digest is set
  openlinkos.org/image-digest: ""
