# Creates the first administrator from the password file in a Secret (RELAY_ADMIN_PASSWORD_FILE). There is no
# default password; create the Secret first:
#
#   openssl rand -base64 18 > admin-password
#   kubectl create secret generic registry-mirrors-relay-admin --from-file=password=admin-password -n <namespace>
#   rm admin-password
#
# Then write in your own kustomization.yaml: components: [<repository>/deploy/kubernetes/components/admin-password]
#
# With writable operational data (single-writable), this administrator must change the password after the first
# sign-in; afterwards the Secret and this component can be removed.
# With read-only operational data (base, multiple replicas), it is the only administrator and its password stays
# valid: use a long enough random password, and reach the console only through port-forward.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: (Deployment|StatefulSet)
      name: registry-mirrors-relay
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: admin-password
          secret:
            secretName: registry-mirrors-relay-admin
            defaultMode: 0440
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: admin-password
          mountPath: /run/secrets/relay-admin
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: RELAY_ADMIN_PASSWORD_FILE
            value: /run/secrets/relay-admin/password
