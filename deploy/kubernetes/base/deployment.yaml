apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-mirrors-relay
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      serviceAccountName: registry-mirrors-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      # on exit /readyz returns 503 first, then downloads in progress get up to 30 seconds (timeouts.shutdown_grace)
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: registry-mirrors-relay
      containers:
        - name: relay
          image: ghcr.io/openlinkos/registry-mirrors-relay
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # /healthz does not check the upstreams: an upstream outage should not restart the relay
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # wait for the Service to remove this Pod before starting to exit (Kubernetes 1.30+)
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            # GOMEMLIMIT is set automatically from this limit (90%)
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/registry-mirrors-relay
              readOnly: true
            - name: data
              mountPath: /var/lib/registry-mirrors-relay
      volumes:
        # the whole directory is mounted (no subPath): when the ConfigMap is edited directly the relay reloads
        # automatically; changing config.yaml through kustomize generates a new ConfigMap and the Deployment rolls
        - name: config
          configMap:
            name: registry-mirrors-relay-config
        # in read-only mode hardly anything is written here
        - name: data
          emptyDir:
            sizeLimit: 64Mi
