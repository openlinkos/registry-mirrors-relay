# Mounted at /etc/registry-mirrors-relay/config.yaml in place of the configuration built into the image. For
# every option see config.example.yaml in the repository.
data_dir: /var/lib/registry-mirrors-relay

listen:
  # Pull entrance. The admin console (/admin/) is on this port too: open to every address and protected by
  # sign-in, through an Ingress or Gateway as well. Metrics answer only direct connections and are off by
  # default; the monitoring overlay turns them on
  http: ":8080"

admin:
  # With multiple replicas the operational data is read-only: accounts, rules and bans are all written in this
  # file, and the console can only view them
  store: {driver: none}

# By default there is one single-domain entrance matching any Host. Write the public domain here; the usage page
# uses it:
# entrances:
#   - name: mirror
#     hosts: [mirror.example.com]
