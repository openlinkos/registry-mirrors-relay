# The pull entrance, and also the entrance for the admin console and metrics. Admin console:
#   kubectl port-forward svc/registry-mirrors-relay 8080:80
# then open http://127.0.0.1:8080/admin/, or open /admin/ through the Ingress or Gateway. Metrics requests through
# an Ingress or Gateway get 404.
# When changing it to NodePort or LoadBalancer, set externalTrafficPolicy: Local; otherwise the source of outside
# clients becomes the node address, which looks like a direct connection from the internal network.
apiVersion: v1
kind: Service
metadata:
  name: registry-mirrors-relay
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
