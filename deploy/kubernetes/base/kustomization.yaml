# Base deployment of registry-mirrors-relay: 2 replicas, read-only operational data (admin.store.driver: none,
# everything comes from config.yaml).
# See docs/deploy.md. Usage: kubectl apply -k deploy/kubernetes/base -n <namespace>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: registry-mirrors-relay
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# a configuration change generates a new name, and the Deployment rolls out with it
configMapGenerator:
  - name: registry-mirrors-relay-config
    files:
      - config.yaml

images:
  - name: ghcr.io/openlinkos/registry-mirrors-relay
    newTag: v0.5.0
