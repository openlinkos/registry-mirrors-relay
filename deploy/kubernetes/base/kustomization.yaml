# registry-mirrors-relay 的基础部署：2 个副本，运营数据只读（admin.store.driver: none，全部来自 config.yaml）。
# 说明见 docs/deploy.md。用法：kubectl apply -k deploy/kubernetes/base -n <命名空间>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: registry-mirrors-relay
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# 配置变了会生成新的名字，Deployment 随之滚动更新
configMapGenerator:
  - name: registry-mirrors-relay-config
    files:
      - config.yaml

images:
  - name: ghcr.io/openlinkos/registry-mirrors-relay
    newTag: v0.2.0
