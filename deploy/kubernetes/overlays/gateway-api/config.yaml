# Exposed through a Gateway. For every option see config.example.yaml in the repository.
data_dir: /var/lib/registry-mirrors-relay

listen:
  http: ":8080"      # the console opens through the Gateway too, protected by sign-in; metrics through the Gateway get 404

client_ip:
  # Trust X-Forwarded-For sent from inside the cluster (the Gateway's Pods). If the cluster's Pod network is not in
  # the private address ranges, change this to the actual range.
  trusted_proxies: [private_ranges]

admin:
  store: {driver: none}

entrances:
  - name: mirror
    hosts: [mirror.example.com]
