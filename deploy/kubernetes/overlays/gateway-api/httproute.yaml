apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry-mirrors-relay
spec:
  parentRefs:
    - name: public-gateway        # 你的 Gateway
      namespace: gateway-system
  hostnames:
    - mirror.example.com
  rules:
    - backendRefs:
        - name: registry-mirrors-relay
          port: 80
      # 镜像层可能要下载很久：关掉总超时（relay 自己按空闲时间判断连接是否断了）
      timeouts:
        request: 0s
        backendRequest: 0s
