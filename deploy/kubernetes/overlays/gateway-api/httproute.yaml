apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry-mirrors-relay
spec:
  parentRefs:
    - name: public-gateway        # your Gateway
      namespace: gateway-system
  hostnames:
    - mirror.example.com
  rules:
    - backendRefs:
        - name: registry-mirrors-relay
          port: 80
      # a layer can take a long time to download: turn off the overall timeouts (the relay itself decides from idle
      # time whether a connection has gone)
      timeouts:
        request: 0s
        backendRequest: 0s
