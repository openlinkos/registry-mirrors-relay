# Exposed through the Gateway API: an HTTPRoute attached to your existing Gateway, which handles HTTPS.
# Change the domain and parentRefs in httproute.yaml. ingress-nginx stopped being maintained in March 2026, so
# the Gateway API is used here; for other Ingress controllers see docs/deploy.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - httproute.yaml

configMapGenerator:
  - name: registry-mirrors-relay-config
    behavior: replace
    files:
      - config.yaml
