apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry-mirrors-relay
spec:
  replicas: 1
  revisionHistoryLimit: 5
  serviceName: registry-mirrors-relay
  template:
    spec:
      serviceAccountName: registry-mirrors-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: registry-mirrors-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/openlinkos/registry-mirrors-relay
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/registry-mirrors-relay
              readOnly: true
            - name: data
              mountPath: /var/lib/registry-mirrors-relay
      volumes:
        - name: config
          configMap:
            name: registry-mirrors-relay-config
  # 运营数据库（state.db）：账号、规则、审计和每小时的统计，通常不到 10 MiB
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
