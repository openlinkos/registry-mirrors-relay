# A single replica with writable operational data: StatefulSet + PVC, and the console can create accounts, add
# rules and ban. Replaces the Deployment and PDB from base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# the base labels apply only to the resources in base, so the StatefulSet added here needs them too (selector included)
labels:
  - pairs:
      app.kubernetes.io/name: registry-mirrors-relay
    includeSelectors: true

resources:
  - ../../base
  - statefulset.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: registry-mirrors-relay
  # with only one replica, minAvailable: 1 would block node maintenance
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: registry-mirrors-relay

configMapGenerator:
  - name: registry-mirrors-relay-config
    behavior: replace
    files:
      - config.yaml
