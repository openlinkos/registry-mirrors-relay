# Turns on metrics (metrics.enabled) and adds a Prometheus Operator ServiceMonitor and a Grafana dashboard
# (a ConfigMap with the grafana_dashboard label, which the Grafana sidecar of kube-prometheus-stack imports
# automatically). Requires the Prometheus Operator CRDs in the cluster. Metrics are served only to direct
# connections: the Pod network must be in admin.allow (the private address ranges by default).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - servicemonitor.yaml

configMapGenerator:
  - name: registry-mirrors-relay-config
    behavior: replace
    files:
      - config.yaml
  - name: registry-mirrors-relay-dashboard
    files:
      - registry-mirrors-relay.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
