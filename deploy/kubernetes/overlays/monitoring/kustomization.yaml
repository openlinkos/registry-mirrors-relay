# 打开指标（metrics.enabled），加上 Prometheus Operator 的 ServiceMonitor，以及一个 Grafana 面板
# （带 grafana_dashboard 标签的 ConfigMap，kube-prometheus-stack 的 Grafana sidecar 会自动导入）。
# 需要集群里装了 Prometheus Operator 的 CRD。指标只给直连的请求：Pod 网段要在 admin.allow 里（默认私有地址段）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - servicemonitor.yaml

configMapGenerator:
  - name: registry-mirrors-relay-config
    behavior: replace
    files:
      - config.yaml
  - name: registry-mirrors-relay-dashboard
    files:
      - registry-mirrors-relay.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
