# Facing the internet directly, with certificates obtained automatically through ACME. For every option see
# config.example.yaml in the repository.
data_dir: /var/lib/registry-mirrors-relay

listen:
  http: ":8080"
  https: ":8443"

tls:
  mode: acme
  acme:
    email: admin@example.com          # Let's Encrypt sends expiry reminders here; optional
    # hosts defaults to the domains named in the entrances below; certificates are stored in data_dir/acme

site:
  name: My Registry Mirror
  operator: Example Org

entrances:
  - name: mirror
    hosts: [mirror.example.com]
