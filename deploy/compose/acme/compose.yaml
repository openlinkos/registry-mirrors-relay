# 直接对外：relay 自己用 ACME（Let's Encrypt）申请证书，监听宿主机的 80 和 443。说明见 docs/deploy.md。
# 域名要先解析到这台机器，80 和 443 端口要能从公网访问（HTTP-01、TLS-ALPN-01 验证）。
#
#   openssl rand -base64 18 > admin-password && chmod 400 admin-password && sudo chown 65532 admin-password
#   docker compose up -d
name: registry-mirrors-relay

services:
  relay:
    image: ghcr.io/openlinkos/registry-mirrors-relay:v0.1.3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:8080"               # 明文：ACME 的 HTTP-01 验证，也能拉取
      - "443:8443"              # HTTPS：证书自动申请和续期
      - "127.0.0.1:9090:9090"   # 管理后台：只在本机，远程用 SSH 转发
      - "127.0.0.1:9180:9180"   # Prometheus 指标
    volumes:
      - ./config.yaml:/etc/registry-mirrors-relay/config.yaml:ro
      - data:/var/lib/registry-mirrors-relay   # 运营数据库和 ACME 证书
    environment:
      RELAY_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    stop_grace_period: 40s
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "5"}

secrets:
  admin_password:
    file: ./admin-password

volumes:
  data:
