# Facing the internet directly: the relay obtains its own certificate with ACME (Let's Encrypt) and listens on
# ports 80 and 443 of the host. See docs/deploy.md.
# The domain must resolve to this machine first, and ports 80 and 443 must be reachable from the internet
# (HTTP-01 and TLS-ALPN-01 validation).
#
#   openssl rand -base64 18 > admin-password && chmod 400 admin-password && sudo chown 65532 admin-password
#   docker compose up -d
name: registry-mirrors-relay

services:
  relay:
    image: ghcr.io/openlinkos/registry-mirrors-relay:v0.6.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:8080"               # plain HTTP: ACME HTTP-01 validation, pulls work here too
      - "443:8443"              # HTTPS: certificates are obtained and renewed automatically; the admin console is at https://<domain>/admin/
    volumes:
      - ./config.yaml:/etc/registry-mirrors-relay/config.yaml:ro
      - data:/var/lib/registry-mirrors-relay   # operational database and ACME certificates
    environment:
      RELAY_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    stop_grace_period: 40s
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "5"}

secrets:
  admin_password:
    file: ./admin-password

volumes:
  data:
