# Behind a CDN or reverse proxy: it handles HTTPS and fetches from port 8080 of this machine. See docs/deploy.md.
#
#   openssl rand -base64 18 > admin-password && chmod 400 admin-password && sudo chown 65532 admin-password
#   docker compose up -d
name: registry-mirrors-relay

services:
  relay:
    image: ghcr.io/openlinkos/registry-mirrors-relay:v0.6.1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:8080"             # pull entrance and admin console (/admin/); the CDN or reverse proxy fetches from here
    volumes:
      - ./config.yaml:/etc/registry-mirrors-relay/config.yaml:ro
      - data:/var/lib/registry-mirrors-relay
    # first administrator: the password comes from the secret file and must be changed after the first sign-in;
    # afterwards these two sections and admin-password can be removed
    environment:
      RELAY_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    stop_grace_period: 40s      # a little longer than timeouts.shutdown_grace (30 seconds), so downloads in progress have time to finish
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "5"}

secrets:
  admin_password:
    file: ./admin-password

volumes:
  data:
