# Behind a CDN or reverse proxy. Once mounted it replaces the configuration file built into the image (anything
# not written here takes the program's default); the admin console is at /admin/ on the same domain. For every
# option see config.example.yaml in the repository.
data_dir: /var/lib/registry-mirrors-relay

listen:
  http: ":8080"

client_ip:
  # Trust X-Forwarded-For only from the origin-fetch addresses of the CDN or reverse proxy. Change them to your own
  # address ranges.
  trusted_proxies:
    - 203.0.113.0/24

site:
  name: My Registry Mirror
  operator: Example Org

entrances:
  # one domain covers every standard usage: the root path (Docker's registry-mirrors), the path prefix, containerd's ns
  - name: mirror
    hosts: [mirror.example.com]
