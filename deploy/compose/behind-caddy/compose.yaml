# Caddy in front handles HTTPS (obtaining certificates automatically); the relay is only on Compose's internal
# network. See docs/deploy.md.
# If you already run Caddy or Nginx, just point its reverse proxy at port 8080 of the relay, following the Caddyfile.
#
#   openssl rand -base64 18 > admin-password && chmod 400 admin-password && sudo chown 65532 admin-password
#   docker compose up -d
name: registry-mirrors-relay

services:
  caddy:
    image: docker.io/library/caddy:2.11.8@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [relay]

  relay:
    image: ghcr.io/openlinkos/registry-mirrors-relay:v0.6.3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # 8080 serves both the pull entrance and the admin console (/admin/), both exposed through Caddy. On the host it
      # is mapped only to 127.0.0.1 (for local debugging)
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/etc/registry-mirrors-relay/config.yaml:ro
      - data:/var/lib/registry-mirrors-relay
    environment:
      RELAY_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    stop_grace_period: 40s
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "5"}

secrets:
  admin_password:
    file: ./admin-password

volumes:
  data:
  caddy-data:
