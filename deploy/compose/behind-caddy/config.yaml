# Caddy in front handles HTTPS. For every option see config.example.yaml in the repository.
data_dir: /var/lib/registry-mirrors-relay

listen:
  http: ":8080"   # the admin console is on this port too; open https://mirror.example.com/admin/ through Caddy

client_ip:
  # the relay's 8080 is only on Compose's internal network and only Caddy can reach it, so X-Forwarded-For from
  # private address ranges is trusted
  trusted_proxies: [private_ranges]

site:
  name: My Registry Mirror
  operator: Example Org

entrances:
  - name: mirror
    hosts: [mirror.example.com]
