# For the kind end-to-end test (scripts/kind-e2e.sh): base plus the admin password component, with the locally
# built image and the pull entrance on NodePort 30080 so that containerd on the nodes can reach it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kubernetes/base

components:
  - ../../kubernetes/components/admin-password

images:
  - name: ghcr.io/openlinkos/registry-mirrors-relay
    newName: registry-mirrors-relay
    newTag: e2e

patches:
  - target:
      kind: Deployment
      name: registry-mirrors-relay
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Service
      name: registry-mirrors-relay
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: add
        path: /spec/externalTrafficPolicy
        value: Local
