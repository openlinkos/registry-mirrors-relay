# kind 端到端测试用（scripts/kind-e2e.sh）：base 加上管理员口令组件，镜像用本地构建的，拉取入口用 NodePort 30080，
# 让节点上的 containerd 能连到。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kubernetes/base

components:
  - ../../kubernetes/components/admin-password

images:
  - name: ghcr.io/openlinkos/registry-mirrors-relay
    newName: registry-mirrors-relay
    newTag: e2e

patches:
  - target:
      kind: Deployment
      name: registry-mirrors-relay
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Service
      name: registry-mirrors-relay
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
