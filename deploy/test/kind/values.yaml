# For the kind end-to-end test (scripts/kind-e2e.sh, INSTALL=helm): equivalent to kustomization.yaml, with the
# same names, NodePort and Secret.
fullnameOverride: registry-mirrors-relay
image:
  repository: registry-mirrors-relay
  tag: e2e
  pullPolicy: Never
service:
  type: NodePort
  nodePort: 30080
  externalTrafficPolicy: Local
admin:
  existingSecret: registry-mirrors-relay-admin
