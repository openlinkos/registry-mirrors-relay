# 测试用配置（scripts/smoke.sh、scripts/isolated-test.sh）：每个上游一个域名（*.relay.test），另有一个单域名入口。
# 管理后台和指标和拉取共用 5000（三合一）。只给本机或测试网络用，不要直接对公网开放。
data_dir: /tmp/relay-data
listen:
  http: ":5000"   # 单域名入口：根路径默认 Docker Hub，另支持 /v2/<上游>/... 前缀和 ?ns=
client_ip:
  trusted_proxies: [private_ranges]
entrances:
  - name: all-in-one
    hosts: ["*"]
  - {hosts: [docker.relay.test], upstream: docker.io}
  - {hosts: [gcr.relay.test], upstream: gcr.io}
  - {hosts: [ghcr.relay.test], upstream: ghcr.io}
  - {hosts: [k8s.relay.test], upstream: registry.k8s.io}
  - {hosts: [quay.relay.test], upstream: quay.io}
metrics: {enabled: true}
admin:
  store: {driver: none}
log:
  level: info
  access:
    output: file
    path: /logs/access.log
