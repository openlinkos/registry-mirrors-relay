# Test configuration (scripts/smoke.sh, scripts/isolated-test.sh): one domain per upstream (*.relay.test), plus a
# single-domain entrance.
# The admin console and metrics share 5000 with pulls (three-in-one): the console is public, metrics are served only
# to direct connections. For the local machine or a test network only; do not expose it to the internet directly.
data_dir: /tmp/relay-data
listen:
  http: ":5000"   # single-domain entrance: the root path defaults to Docker Hub; the /v2/<upstream>/... prefix and ?ns= also work
client_ip:
  trusted_proxies: [private_ranges]
entrances:
  - name: all-in-one
    hosts: ["*"]
  - {hosts: [docker.relay.test], upstream: docker.io}
  - {hosts: [gcr.relay.test], upstream: gcr.io}
  - {hosts: [ghcr.relay.test], upstream: ghcr.io}
  - {hosts: [k8s.relay.test], upstream: registry.k8s.io}
  - {hosts: [quay.relay.test], upstream: quay.io}
metrics: {enabled: true}
admin:
  store: {driver: none}
log:
  level: info
  access:
    output: file
    path: /logs/access.log
