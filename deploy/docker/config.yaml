# The configuration built into the image. To change it, mount your own configuration over
# /etc/registry-mirrors-relay/config.yaml; see config.example.yaml in the repository for the syntax. Write only
# what differs from the defaults.
#
# First administrator: the first start creates admin with a generated password, written to the log once
# (docker logs <container> | grep 'generated password'); docker exec -it <container> registry-mirrors-relay admin
# password sets one at any time. To choose the first one yourself, set RELAY_ADMIN_PASSWORD_FILE to a password file
# (a Docker, Compose or k8s secret). See docs/admin.md.

# The operational database (state.db) and ACME certificates are kept here; mount a volume. No image data is stored.
data_dir: /var/lib/registry-mirrors-relay

# The pull entrance and the admin console (/admin/) are both on 8080. The console is open to every address and
# protected by account passwords; put it behind HTTPS when it faces the internet (see docs/deploy.md), and to
# open it only to the local machine and the internal network write admin: {public: false}.
listen:
  http: ":8080"
