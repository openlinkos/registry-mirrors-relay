# registry-mirrors-relay 配置示例。只需要写和默认值不同的部分。
# 运行 registry-mirrors-relay check -config 本文件 -print 可以查看全部生效的值（含默认值）。
#
# 这个例子：放在 CDN 之后（CDN 负责 TLS），一个单域名入口覆盖所有标准用法，另有每个上游一个子域名的旧用法。

# 运营数据库和 ACME 证书放在这里，不存放任何镜像数据。
data_dir: /var/lib/registry-mirrors-relay

listen:
  http: ":8080"              # 拉取入口（明文），CDN 回源到这里。管理后台（/admin/）和指标（/metrics）默认也在这个端口
  # admin: "127.0.0.1:9090"  # 写了就把管理后台、管理 API 和指标挪到这个单独的端口

client_ip:
  # 只信任 CDN 回源地址发来的 X-Forwarded-For，从右往左取第一个不受信任的地址
  trusted_proxies:
    - 10.0.0.0/8
    - 203.0.113.0/24

site:
  name: LinkOS Mirrors
  operator: OpenLinkOS
  links:
    home: https://linkos.org
    status: https://uptime.linkos.org
    source: https://github.com/openlinkos/registry-mirrors-relay
  # 用法页上显示服务状态（/status.json）：各上游的连通性和近 24 小时的可用率、本站的请求成功率。默认打开
  # show_status: true

entrances:
  # 单域名入口：
  #   docker pull mirror.example.com/library/nginx         根路径，默认 Docker Hub（daemon.json 的 registry-mirrors 也是这样）
  #   docker pull mirror.example.com/ghcr.io/owner/image   路径前缀
  #   containerd 的 hosts.toml 指向这里时，按 ?ns= 选上游
  - name: mirror
    hosts: [mirror.example.com]

  # 每个上游一个子域名（兼容旧用法）
  - hosts: [docker.example.com]
    upstream: docker.io
  - hosts: [ghcr.example.com]
    upstream: ghcr.io
  - hosts: [gcr.example.com]
    upstream: gcr.io
  - hosts: [k8s.example.com]
    upstream: registry.k8s.io
  - hosts: [quay.example.com]
    upstream: quay.io

  # 需要登录的入口：账号在 access.users_file 或管理后台里。用法页默认谁都能看，只有拉取要登录；
  # page: login 时用法页也要登录，page: off 时不提供用法页
  # - hosts: [private.example.com]
  #   auth: basic
  #   page: public

upstreams:
  # 内置 docker.io、gcr.io、ghcr.io、registry.k8s.io、quay.io。同名的上游只写要改的字段。
  quay.io:
    unlisted_redirect: pass   # 白名单外的重定向原样交给客户端；改成 deny 则返回 502
  # 新增一个上游
  mcr.microsoft.com:
    registry: mcr.microsoft.com
    redirect_hosts: ['(?:[a-z0-9-]+\.)*mcr\.microsoft\.com', '(?:[a-z0-9-]+\.)*azureedge\.net']
    token_realm_hosts: ['mcr\.microsoft\.com']
  # 给 Docker Hub 配一个只能读公开仓库的令牌，提高共用的额度：
  # docker.io:
  #   credentials:
  #     username: your-bot
  #     password: {env: DOCKERHUB_TOKEN}
  #     realm_host: auth.docker.io
  #     public_only: true

access:
  # users_file: /etc/registry-mirrors-relay/htpasswd   # bcrypt，可用 registry-mirrors-relay hash-password 生成
  images:
    deny:
      - pattern: "ghcr.io/example-bad-actor/**"
        status: 451
        message: "此镜像因投诉已屏蔽"

limits:
  manifest_rate: 2       # 每个客户端每秒的 manifest 请求，突发 120
  manifest_burst: 120
  blob_streams_per_client: 16

# manifest 内存缓存（只放 manifest，不放镜像层）。按 tag 拉取时先 HEAD（Docker Hub 不计次数），
# 同一个 tag 反复拉只有第一次消耗上游额度。max_bytes 为 0 时关闭。
# cache:
#   max_bytes: 64MiB
#   tag_ttl: 30s          # tag → digest 的映射多久后重新确认
#   stale_if_error: 6h    # 上游出错时还能用旧的映射多久

# proxy:
#   buffer_size: 16KiB    # 每个流的转发缓冲
#   blob_http2: false     # 镜像层默认走 HTTP/1.1，见 docs/benchmark.md
#   breaker_failures: 5   # 连续 5 次连不上上游就熔断
#   breaker_cooldown: 10s
#   health_interval: 1m   # 探测各上游 /v2/ 的间隔（不算拉取次数），0 表示不探测

# 管理后台和 API（见 docs/admin.md、docs/api.md）。运营数据（后台建的账号、规则、封禁）存在 data_dir/state.db。
admin:
  # 第一个管理员：没有默认口令。运营数据库里还没有管理员时按它创建，第一次登录后必须改口令，之后请删掉这一段。
  # 容器里更简单的做法是设置环境变量 RELAY_ADMIN_PASSWORD_FILE 指向口令文件（secret）。
  # 也可以停止服务后运行 registry-mirrors-relay admin create。见 docs/admin.md。
  # initial_admin:
  #   username: admin
  #   password: {file: /run/secrets/relay_admin_password}   # 12 到 72 个字节，不要直接写在配置里
  # 谁能打开管理后台、管理 API 和指标：只接受不经代理的直连，并且对端在这些地址里。
  # 经 CDN、反向代理来的请求一律当作不存在（404）。远程用 SSH 隧道或 kubectl port-forward
  # allow: [loopback, private_ranges]
  # 要经 https 反向代理访问后台时：写 public_url，代理写进 client_ip.trusted_proxies，再放行客户端地址
  # public_url: https://admin.example.com
  # proxied_allow: [198.51.100.0/24]
  api_tokens:
    - {name: ops, role: admin, token: {env: RELAY_ADMIN_TOKEN}}   # 至少 32 个字符：openssl rand -hex 32
  # store: {driver: none}   # k8s 多副本时：运营数据只读，全部来自配置文件

# Prometheus 指标：和管理后台在同一个入口（同样只接受本机、内网直连），默认关
# metrics:
#   enabled: true
#   pprof: false   # 再开 /debug/pprof/

log:
  access:
    output: stdout       # 容器里写 stdout；也可以写 file，按大小轮转
