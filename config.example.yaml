# Example registry-mirrors-relay configuration. Write only what differs from the defaults.
# Run registry-mirrors-relay check -config <this file> -print to see every effective value (defaults included).
#
# This example: behind a CDN (the CDN handles TLS), one single-domain entrance covering every standard usage, plus
# the older style with one subdomain per upstream.

# The operational database and ACME certificates are kept here; no image data is stored.
data_dir: /var/lib/registry-mirrors-relay

listen:
  http: ":8080"              # pull entrance (plain HTTP); the CDN's origin fetches arrive here. The admin console (/admin/) and metrics (/metrics) are on this port too by default
  # admin: "127.0.0.1:9090"  # when set, moves the admin console, the management API and the metrics to this separate port

client_ip:
  # Trust X-Forwarded-For only from the CDN's origin-fetch addresses; take the first untrusted address from the right
  trusted_proxies:
    - 10.0.0.0/8
    - 203.0.113.0/24

site:
  name: Example Mirrors
  operator: Example Org
  # The colours and marks of a brand of the OpenLinkOS design system, for OpenLinkOS and LinkOS services
  # (linkos-mirrors, for one). Leave it out for the neutral look.
  # brand: linkos-mirrors
  links:
    home: https://example.com
    status: https://status.example.com
    source: https://github.com/openlinkos/registry-mirrors-relay
  # Show the service status on the usage page (/status.json): each upstream's reachability and availability over the
  # last 24 hours, and this site's request success rate. On by default
  # show_status: true

entrances:
  # Single-domain entrance:
  #   docker pull mirror.example.com/library/nginx         root path, Docker Hub by default (registry-mirrors in daemon.json works the same way)
  #   docker pull mirror.example.com/ghcr.io/owner/image   path prefix
  #   when containerd's hosts.toml points here, the upstream is chosen by ?ns=
  - name: mirror
    hosts: [mirror.example.com]

  # One subdomain per upstream (compatible with the older usage)
  - hosts: [docker.example.com]
    upstream: docker.io
  - hosts: [ghcr.example.com]
    upstream: ghcr.io
  - hosts: [gcr.example.com]
    upstream: gcr.io
  - hosts: [k8s.example.com]
    upstream: registry.k8s.io
  - hosts: [quay.example.com]
    upstream: quay.io

  # An entrance that requires sign-in: the accounts are in access.users_file or the admin console. By default anyone
  # can see the usage page and only pulls require sign-in; with page: login the usage page requires sign-in too, and
  # with page: off there is no usage page
  # - hosts: [private.example.com]
  #   auth: basic
  #   page: public

upstreams:
  # Built in: docker.io, gcr.io, ghcr.io, registry.k8s.io, quay.io. For an upstream with the same name, write only the fields to change.
  quay.io:
    unlisted_redirect: pass   # redirects outside the allow list are handed to the client as they are; deny returns 502 instead
  # Add an upstream
  mcr.microsoft.com:
    registry: mcr.microsoft.com
    redirect_hosts: ['(?:[a-z0-9-]+\.)*mcr\.microsoft\.com', '(?:[a-z0-9-]+\.)*azureedge\.net']
    token_realm_hosts: ['mcr\.microsoft\.com']
  # Give Docker Hub a token that can only read public repositories, to raise the shared quota:
  # docker.io:
  #   credentials:
  #     username: your-bot
  #     password: {env: DOCKERHUB_TOKEN}
  #     realm_host: auth.docker.io
  #     public_only: true

access:
  # users_file: /etc/registry-mirrors-relay/htpasswd   # bcrypt; registry-mirrors-relay hash-password can generate it
  images:
    deny:
      - pattern: "ghcr.io/example-bad-actor/**"
        status: 451
        message: "This image has been blocked following a complaint"

limits:
  manifest_rate: 2       # manifest requests per client per second, burst 120
  manifest_burst: 120
  blob_streams_per_client: 16

# In-memory manifest cache (manifests only, never layers). Pulls by tag start with a HEAD (which Docker Hub does not
# count), so pulling the same tag again and again uses upstream quota only the first time. max_bytes: 0 turns it off.
# cache:
#   max_bytes: 64MiB
#   tag_ttl: 30s          # how long until a tag → digest mapping is confirmed again
#   stale_if_error: 6h    # how long the old mapping can still be used while the upstream returns errors

# proxy:
#   buffer_size: 16KiB    # forwarding buffer per stream
#   blob_http2: false     # layers use HTTP/1.1 by default, see docs/benchmark.md
#   breaker_failures: 5   # the breaker trips after 5 consecutive failures to reach the upstream
#   breaker_cooldown: 10s
#   health_interval: 1m   # interval between probes of each upstream's /v2/ (not counted as pulls); 0 disables probing

# Admin console and API (see docs/admin.md, docs/api.md). Operational data (accounts, rules and bans created in the
# console) is stored in data_dir/state.db.
admin:
  # First administrator: there is no default password. On the first start the service creates admin with a generated
  # password, written to the log once; registry-mirrors-relay admin password sets one at any time, also while the
  # service runs. To choose the first one yourself, use this section (applied while the operational database has no
  # administrator; the password must be changed after the first sign-in, and the section should then be removed), or
  # in a container point RELAY_ADMIN_PASSWORD_FILE at a password file (a secret). See docs/admin.md.
  # initial_admin:
  #   username: admin
  #   password: {file: /run/secrets/relay_admin_password}   # 12 to 72 bytes; do not write it into the configuration directly
  # The admin console and the management API are open to every address by default: through a CDN or reverse proxy they
  # open on the pull domain (/admin/), protected by sign-in.
  # Put them behind HTTPS when they face the internet. With false, only the addresses in allow and proxied_allow below get
  # an answer, and proxied requests always get 404
  # public: true
  # Metrics and pprof (no sign-in), and the console when public: false: only direct connections that do not come through a
  # proxy are accepted, and the peer must be in these addresses
  # allow: [loopback, private_ranges]
  # The console's canonical address (optional): when it is an https address, access through it accepts only the __Host-
  # session cookie
  # public_url: https://admin.example.com
  # To reach the console through an https reverse proxy as well when public: false, add the proxy to
  # client_ip.trusted_proxies, then allow the client addresses
  # proxied_allow: [198.51.100.0/24]
  api_tokens:
    - {name: ops, role: admin, token: {env: RELAY_ADMIN_TOKEN}}   # at least 32 characters: openssl rand -hex 32
  # Changing the configuration in the console (entrances, upstreams, limits, cache and more): stored in state.db, layered
  # on top of this file, on by default.
  # Set false when the configuration lives in Git and this file must be the only source of truth: console overrides then
  # never take effect and can only be reset. See docs/admin.md
  # config_edit: true
  # store: {driver: none}   # for multiple replicas on k8s: operational data is read-only and comes entirely from the configuration file

# Prometheus metrics: on the same entrance as the admin console, accepting only direct connections from the local machine
# and the internal network (admin.allow); off by default
# metrics:
#   enabled: true
#   pprof: false   # also enables /debug/pprof/

log:
  access:
    output: stdout       # in a container write to stdout; file is also possible, rotated by size
