version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - nilerr
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G115 # integer conversions: every conversion here is bounded, and annotating each one would only hurt readability
  exclusions:
    rules:
      - path: (_test\.go|internal/testutil/|tools/)
        linters: [gosec, noctx, bodyclose, usestdlibvars, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openlinkos/registry-mirrors-relay
