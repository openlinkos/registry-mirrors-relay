# Dependency updates: Go modules, GitHub Actions (pinned by commit SHA), the image's base image (pinned by
# digest) and the images in the Compose examples.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories: ["/deploy/compose/*"]
    schedule:
      interval: weekly
    ignore:
      # our own image is updated along with releases
      - dependency-name: ghcr.io/openlinkos/registry-mirrors-relay
