name: release

# 推送 v* 标签时发布：二进制、压缩包、SHA256SUMS（cosign keyless 签名）、SBOM、多平台镜像（签名），
# 并为二进制和镜像生成 GitHub 的构建来源证明。配置见 .goreleaser.yaml。
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # GitHub Release
      packages: write       # ghcr.io/openlinkos/registry-mirrors-relay
      id-token: write       # cosign keyless、构建来源证明
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同一个提交上有多个标签时（例如先发了 -rc），按触发这次运行的标签发布
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: image digest
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/openlinkos/registry-mirrors-relay:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openlinkos/registry-mirrors-relay
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
