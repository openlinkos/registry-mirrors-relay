name: release

# 推送 v* 标签时发布：二进制、压缩包、SHA256SUMS（cosign keyless 签名）、SBOM、多平台镜像（签名）、
# Helm chart（OCI，签名），并为二进制、镜像和 chart 生成 GitHub 的构建来源证明；最后从 GHCR 匿名安装一遍 chart 验证。
# 配置见 .goreleaser.yaml。
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # GitHub Release
      packages: write       # ghcr.io/openlinkos/registry-mirrors-relay、ghcr.io/openlinkos/charts/registry-mirrors-relay
      id-token: write       # cosign keyless、构建来源证明
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: install helm and yq
        run: scripts/ci-tools.sh helm chart
      # chart 有问题时在发布任何东西之前停下
      - name: helm lint
        run: helm4 lint --strict charts/registry-mirrors-relay
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同一个提交上有多个标签时（例如先发了 -rc），按触发这次运行的标签发布
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: image digest
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/openlinkos/registry-mirrors-relay:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openlinkos/registry-mirrors-relay
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: helm chart
        id: chart
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HELM=helm4 scripts/package-chart.sh "$TAG" "$IMAGE_DIGEST" dist/chart
          printf '%s' "$TOKEN" | helm4 registry login ghcr.io -u "$ACTOR" --password-stdin
          helm4 push "dist/chart/registry-mirrors-relay-${TAG#v}.tgz" oci://ghcr.io/openlinkos/charts >dist/chart/push.log 2>&1 ||
            { cat dist/chart/push.log; exit 1; }
          cat dist/chart/push.log
          digest="$(sed -n 's/^Digest: //p' dist/chart/push.log)"
          case "$digest" in sha256:*) ;; *) echo "helm push 的输出里没有 digest"; exit 1 ;; esac
          cosign sign --yes "ghcr.io/openlinkos/charts/registry-mirrors-relay@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openlinkos/charts/registry-mirrors-relay
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

  # 发布之后从 GHCR 匿名拉取刚发布的 chart 和镜像，装进 kind（restricted 命名空间）再跑 helm test
  verify:
    name: verify the published chart
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: install tools
        run: scripts/ci-tools.sh kubectl kind helm
      - name: helm install from the registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cosign verify "ghcr.io/openlinkos/charts/registry-mirrors-relay:$version" \
            --certificate-identity "https://github.com/openlinkos/registry-mirrors-relay/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          kind create cluster --wait 120s
          kubectl create namespace relay
          kubectl label namespace relay pod-security.kubernetes.io/enforce=restricted
          helm4 install registry-mirrors-relay oci://ghcr.io/openlinkos/charts/registry-mirrors-relay --version "$version" \
            -n relay --wait --timeout 5m
          helm4 test registry-mirrors-relay -n relay --logs
          image="$(kubectl -n relay get deploy registry-mirrors-relay -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "$image"
          case "$image" in "ghcr.io/openlinkos/registry-mirrors-relay:$TAG@sha256:"*) ;; *) echo "没有按 digest 拉取本次发布的镜像"; exit 1 ;; esac
